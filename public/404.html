<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaizen</title>
    <script>
      var base = '/kaizen/';
      var path = location.pathname
        .replace(new RegExp('^' + base.replace(/\//g, '\\/') + '?'), '')
        .replace(/^\//, '') || '';
      location.replace(base.replace(/\/$/, '') + '/#' + (path ? '/' + path : '/'));
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
